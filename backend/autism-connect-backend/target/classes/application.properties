# ============================================================
# AUTISM CONNECT INDIA - Backend Configuration
# ============================================================

server.port=8080

# ---------- MySQL Datasource ----------
spring.datasource.url=jdbc:mysql://localhost:3306/autism_connect_india?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=manager123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ---------- JWT ----------
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_256_BITS_LONG
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:3000

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.autismconnect=DEBUG
