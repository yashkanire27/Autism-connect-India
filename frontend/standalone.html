<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autism Connect | Multilingual Digital Support Platform for Caregivers</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#F5F3FF', 100: '#EDE9FE', 500: '#8B5CF6', 600: '#7C3AED', 700: '#6D28D9' },
            cream: { 50: '#FFFDF9', 100: '#FDFBF7', 200: '#F7F3EA' },
            skybrand: { 50: '#F0F9FF', 100: '#E0F2FE', 600: '#0284C7' }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            dyslexic: ['Comic Sans MS', 'sans-serif']
          },
          borderRadius: { '3xl': '1.5rem', '4xl': '2rem' },
          boxShadow: { 'soft': '0 10px 30px -5px rgba(124, 58, 237, 0.05)' }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; background-color: #FDFBF7; color: #1E293B; }
    .glass-nav { background: rgba(253, 251, 247, 0.9); backdrop-filter: blur(16px); }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .animate-float { animation: float 6s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Translations Dictionary
    const translations = {
      en: {
        title: "You're not alone on this journey.",
        subtitle: "Discover trusted information, early guidance, community support, and resources — all in one place.",
        badge: "A supportive digital space for every parent",
        disclaimer: "This tool provides general observational guidance and is not a medical diagnosis."
      },
      mr: {
        title: "या प्रवासात तुम्ही एकटे नाही आहात.",
        subtitle: "विश्वसनीय माहिती, प्रारंभिक मार्गदर्शन, समुदाय पाठिंबा आणि संसाधने — सर्व एकाच ठिकाणी मिळवा.",
        badge: "प्रत्येक पालकासाठी एक सहाय्यक डिजिटल जागा",
        disclaimer: "हे साधन केवळ सामान्य मार्गदर्शन प्रदान करते आणि ते वैद्यकीय निदान नाही."
      },
      hi: {
        title: "आप इस यात्रा में अकेले नहीं हैं।",
        subtitle: "विश्वसनीय जानकारी, शुरुआती मार्गदर्शन, सामुदायिक सहायता और संसाधन — सब एक ही स्थान पर।",
        badge: "हर माता-पिता के लिए एक सहायक डिजिटल मंच",
        disclaimer: "यह उपकरण केवल सामान्य मार्गदर्शन प्रदान करता है और यह चिकित्सीय निदान नहीं है।"
      },
      bn: {
        title: "এই যাত্রায় আপনি একা নন।",
        subtitle: "নির্ভরযোগ্য তথ্য, প্রাথমিক দিকনির্দেশনা, সামাজিক সহায়তা এবং সম্পদ — সবই এক জায়গায়।",
        badge: "প্রতিটি অভিভাবকের জন্য একটি সহায়ক ডিজিটাল প্ল্যাটফর্ম",
        disclaimer: "এই টুলটি সাধারণ নির্দেশিকা প্রদান করে এবং এটি কোনো চিকিৎসাগত ডায়াগনোসিস নয়।"
      },
      ta: {
        title: "இந்தப் பயணத்தில் நீங்கள் தனியாக இல்லை.",
        subtitle: "நம்பகமான தகவல்கள், ஆரம்ப வழிகாட்டுதல், சமூக ஆதரவு மற்றும் வளங்கள் — அனைத்தும் ஒரே இடத்தில்.",
        badge: "ஒவ்வொரு பெற்றோருக்குமான ஆதரவு டிஜிட்டல் தளம்",
        disclaimer: "இக்கருவி பொதுவான வழிகாட்டுதலை மட்டுமே வழங்குகிறது, இது மருத்துவ பரிசோதனை அல்ல."
      }
    };

    function App() {
      const [view, setView] = useState('home');
      const [lang, setLang] = useState('en');
      const [toast, setToast] = useState(null);
      const [commScore, setCommScore] = useState(75);
      const [socialScore, setSocialScore] = useState(65);

      const t = translations[lang];

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Header */}
          <header className="sticky top-0 z-40 glass-nav border-b border-purple-100 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
              <div className="w-10 h-10 rounded-2xl bg-purple-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-purple-200">
                ❤️
              </div>
              <div>
                <span className="text-xl font-extrabold text-purple-900 tracking-tight">Autism Connect</span>
                <span className="block text-[10px] uppercase font-bold text-purple-600 tracking-wider">Multilingual Support</span>
              </div>
            </div>

            <nav className="hidden md:flex items-center gap-2 bg-white px-4 py-1.5 rounded-full border border-purple-100 shadow-sm text-sm font-semibold">
              <button onClick={() => setView('home')} className={`px-4 py-1.5 rounded-full ${view==='home'?'bg-purple-600 text-white':'text-slate-600 hover:text-purple-700'}`}>Home</button>
              <button onClick={() => setView('guidance')} className={`px-4 py-1.5 rounded-full ${view==='guidance'?'bg-purple-600 text-white':'text-slate-600 hover:text-purple-700'}`}>Early Guidance</button>
              <button onClick={() => setView('community')} className={`px-4 py-1.5 rounded-full ${view==='community'?'bg-purple-600 text-white':'text-slate-600 hover:text-purple-700'}`}>Community</button>
              <button onClick={() => setView('fundraising')} className={`px-4 py-1.5 rounded-full ${view==='fundraising'?'bg-purple-600 text-white':'text-slate-600 hover:text-purple-700'}`}>Fundraising</button>
              <button onClick={() => setView('resources')} className={`px-4 py-1.5 rounded-full ${view==='resources'?'bg-purple-600 text-white':'text-slate-600 hover:text-purple-700'}`}>Resources</button>
            </nav>

            <div className="flex items-center gap-3">
              <select
                value={lang}
                onChange={(e) => { setLang(e.target.value); triggerToast(`Language switched to ${e.target.value.toUpperCase()}`); }}
                className="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-800"
              >
                <option value="en">🇬🇧 English</option>
                <option value="mr">🇮🇳 मराठी (Marathi)</option>
                <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
                <option value="bn">🇮🇳 বাংলা (Bengali)</option>
                <option value="ta">🇮🇳 தமிழ் (Tamil)</option>
              </select>

              <button
                onClick={() => setView('guidance')}
                className="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-md"
              >
                Get Started
              </button>
            </div>
          </header>

          {/* Body Views */}
          <main className="flex-1">
            {view === 'home' && (
              <div className="space-y-16 py-12">
                
                {/* Hero */}
                <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                  <div className="lg:col-span-7 space-y-6">
                    <span className="inline-block px-4 py-1.5 bg-purple-100 text-purple-800 rounded-full text-xs font-bold">
                      ✨ {t.badge}
                    </span>
                    <h1 className="text-4xl sm:text-6xl font-extrabold text-slate-900 leading-tight">
                      {t.title}
                    </h1>
                    <p className="text-lg text-slate-600 max-w-xl">
                      {t.subtitle}
                    </p>
                    <div className="flex gap-4 pt-2">
                      <button onClick={() => setView('guidance')} className="px-8 py-4 bg-purple-600 text-white font-extrabold text-sm rounded-2xl shadow-lg">
                        Explore Guidance Tool →
                      </button>
                      <button onClick={() => setView('resources')} className="px-6 py-4 bg-white text-purple-900 border border-purple-200 font-bold text-sm rounded-2xl">
                        Learn About Autism
                      </button>
                    </div>
                  </div>

                  <div className="lg:col-span-5 relative">
                    <div className="p-8 rounded-4xl bg-gradient-to-tr from-purple-100 to-sky-100 border border-white shadow-xl text-center space-y-4">
                      <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&q=80&w=400" className="w-32 h-32 mx-auto rounded-full object-cover shadow-md border-4 border-white" />
                      <h3 className="font-extrabold text-slate-900 text-lg">Parenting Support Portal</h3>
                      <p className="text-xs text-purple-700 font-medium">Trusted Information • Community • Early Guidance</p>
                    </div>
                  </div>
                </div>

                {/* Safety Banner */}
                <div className="max-w-7xl mx-auto px-6">
                  <div className="p-6 bg-amber-50 border-2 border-amber-200 rounded-3xl flex items-start gap-4">
                    <div className="text-2xl">⚠️</div>
                    <div>
                      <h4 className="font-extrabold text-amber-900 text-sm">IMPORTANT PRODUCT SAFETY NOTICE</h4>
                      <p className="text-amber-950 font-bold text-sm">“{t.disclaimer}”</p>
                      <p className="text-xs text-amber-800 mt-0.5">Please consult qualified pediatricians and certified specialists for clinical diagnostics.</p>
                    </div>
                  </div>
                </div>

                {/* Bento Grid */}
                <div className="max-w-7xl mx-auto px-6 space-y-6">
                  <div className="text-center space-y-2">
                    <h2 className="text-3xl font-extrabold text-slate-900">Support that starts with understanding.</h2>
                    <p className="text-slate-600 text-sm">Everything parents and caregivers need in one clean, accessible platform.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div onClick={() => setView('resources')} className="p-6 bg-purple-900 text-white rounded-3xl shadow-lg cursor-pointer hover:scale-[1.01] transition-transform">
                      <div className="text-2xl mb-2">📚</div>
                      <h3 className="font-bold text-xl mb-1">Learn & Understand</h3>
                      <p className="text-purple-200 text-xs">Clear autism guides, sensory awareness, and evidence-based education.</p>
                    </div>

                    <div onClick={() => setView('guidance')} className="p-6 bg-sky-50 border border-sky-200 rounded-3xl shadow-sm cursor-pointer hover:scale-[1.01] transition-transform">
                      <div className="text-2xl mb-2">✨</div>
                      <h3 className="font-bold text-xl text-slate-900 mb-1">Early Guidance</h3>
                      <p className="text-slate-600 text-xs">Symptom checklists and observational milestone guides.</p>
                    </div>

                    <div onClick={() => setView('community')} className="p-6 bg-emerald-50 border border-emerald-200 rounded-3xl shadow-sm cursor-pointer hover:scale-[1.01] transition-transform">
                      <div className="text-2xl mb-2">💬</div>
                      <h3 className="font-bold text-xl text-slate-900 mb-1">Parent Community</h3>
                      <p className="text-slate-600 text-xs">A safe space to share real experiences and encourage each other.</p>
                    </div>
                  </div>
                </div>

              </div>
            )}

            {view === 'guidance' && (
              <div className="max-w-3xl mx-auto px-6 py-12 space-y-6">
                <h1 className="text-3xl font-extrabold text-slate-900 text-center">Interactive Early Guidance Checklist</h1>
                <div className="p-8 bg-white border border-purple-100 rounded-4xl shadow-xl space-y-6">
                  <p className="text-xs font-bold text-purple-700 uppercase">Question 1 of 6 • Communication</p>
                  <h3 className="text-xl font-bold text-slate-900">How does your child respond when you call their name across a room?</h3>
                  <div className="space-y-3">
                    <button onClick={() => triggerToast("Option recorded ✓")} className="w-full p-4 border rounded-2xl text-left text-xs font-semibold hover:bg-purple-50">Consistently turns and makes eye contact</button>
                    <button onClick={() => triggerToast("Option recorded ✓")} className="w-full p-4 border rounded-2xl text-left text-xs font-semibold hover:bg-purple-50">Turns occasionally or after multiple repetitions</button>
                    <button onClick={() => triggerToast("Option recorded ✓")} className="w-full p-4 border rounded-2xl text-left text-xs font-semibold hover:bg-purple-50">Rarely turns, appears deeply absorbed in activity</button>
                  </div>
                </div>
              </div>
            )}

            {view === 'community' && (
              <div className="max-w-4xl mx-auto px-6 py-12 space-y-6">
                <h1 className="text-3xl font-extrabold text-slate-900">Parent Community Discussions</h1>
                <div className="p-6 bg-white border rounded-3xl space-y-3 shadow-sm">
                  <span className="text-xs font-bold text-purple-700 bg-purple-100 px-3 py-1 rounded-full">Early Intervention</span>
                  <h3 className="font-bold text-lg text-slate-900">How PECS cards helped our 3yo son express his morning routine!</h3>
                  <p className="text-xs text-slate-600 leading-relaxed">We started introducing PECS cards 3 months ago when my son was struggling to tell us what he wanted for breakfast. Yesterday he handed me the milk card with a huge smile!</p>
                  <p className="text-[11px] text-slate-400 font-semibold">— Pooja R., Parent Member • 2 hours ago</p>
                </div>
              </div>
            )}

            {view === 'fundraising' && (
              <div className="max-w-4xl mx-auto px-6 py-12 space-y-6">
                <h1 className="text-3xl font-extrabold text-slate-900">Community Support Campaigns</h1>
                <div className="p-6 bg-white border border-rose-100 rounded-3xl shadow-sm space-y-4">
                  <h3 className="font-bold text-lg text-slate-900">Speech & AAC Device Grant for Aarav (Age 5)</h3>
                  <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                    <div className="bg-rose-600 h-full w-[72%]" />
                  </div>
                  <div className="flex justify-between text-xs font-bold">
                    <span>Raised: ₹72,500</span>
                    <span>Goal: ₹1,00,000</span>
                  </div>
                  <button onClick={() => triggerToast("Donation simulation triggered ❤️")} className="w-full py-3 bg-rose-600 text-white font-bold text-xs rounded-xl shadow-md">Support This Campaign</button>
                </div>
              </div>
            )}

            {view === 'resources' && (
              <div className="max-w-4xl mx-auto px-6 py-12 space-y-6">
                <h1 className="text-3xl font-extrabold text-slate-900">Resource & Knowledge Library</h1>
                <div className="p-6 bg-cream-50 border rounded-3xl space-y-2">
                  <span className="text-xs font-bold text-purple-700 uppercase">Autism Basics</span>
                  <h3 className="font-bold text-lg text-slate-900">Understanding Autism Spectrum Disorder: A Caregiver's Compass</h3>
                  <p className="text-xs text-slate-600">A compassionate, non-jargon overview of neurodiversity, sensory processing variations, and early supportive measures.</p>
                </div>
              </div>
            )}
          </main>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold animate-bounce">
              {toast}
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-10 px-6 text-center text-xs space-y-2">
            <p className="text-white font-bold text-base">Autism Connect</p>
            <p>Connecting parents with information, support, and hope.</p>
            <p className="text-[11px] opacity-70">© 2026 Autism Connect. All rights reserved. Educational platform only — not a medical diagnostic tool.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
